  <title>知星 · 观星台</title>
  <link rel="icon" href="./media/static-home/approved-symbol.png" type="image/png">
  <link rel="preload" as="image" href="./observatory-opening/taiji-original.png" fetchpriority="high">
  <link rel="stylesheet" href="./observatory-opening/opening.css?v=bf4c09227500">

  <script type="module" src="./observatory-opening/opening.js?v=b26980aae8ec"></script>

<body>
  <main class="observatory" aria-label="知星观星台">
    <div class="scene" aria-hidden="true">
      <img class="scene-poster" src="./observatory-opening/taiji-original.png" width="1672" height="941" alt="" fetchpriority="high">
      <canvas class="scene-canvas"></canvas>
      <div class="scene-shade"></div>
    </div>
    <header class="masthead">
      <a class="brand-home" href="./" aria-label="知星首页">
        <img src="./media/static-home/approved-symbol.png" width="44" height="44" alt="">
        <span>知星</span>
      </a>
      <nav class="tools" aria-label="页面工具">
        <button class="icon-button motion-control" type="button" aria-label="暂停动态" aria-pressed="false" data-tooltip="暂停动态" hidden>
          <span class="pause-icon"><i data-lucide="pause" aria-hidden="true"></i></span>
          <span class="play-icon"><i data-lucide="play" aria-hidden="true"></i></span>
        </button>
        <a class="profile-link" href="./profile.html" aria-label="我的资料" data-tooltip="我的资料">
          <i data-lucide="user-round" aria-hidden="true"></i><span>我的资料</span>
        </a>
      </nav>
    </header>
    <section class="brand-lockup" aria-label="知星，以易理观己，以星盘为证">
      <div class="brand-rule" aria-hidden="true"></div>
      <h1><span>知</span><span>星</span></h1>
      <p>以易理观己<span class="tagline-separator" aria-hidden="true"></span>以星盘为证</p>
    </section>
    <div class="entry-action">
      <a class="enter" href="./app.html"><span>进入知星</span><i data-lucide="arrow-right" aria-hidden="true"></i></a>
      <span class="entry-line" aria-hidden="true"></span>
    </div>
    <footer class="filing">
      <span>贵州天云稀泉科技有限公司</span>
      <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">黔ICP备2026013593号-1</a>
    </footer>
    <div class="blackout" aria-hidden="true"></div>
  </main>
