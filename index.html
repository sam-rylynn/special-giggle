<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090F">
<title>知·星 — 观星台·太极</title>
<style>
  :root{
    --ink:#0E1220; --gold:#C9A85C; --moon:#E8E4D8; --mist:#6B7280;
    --serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#07090F;overflow:hidden;overscroll-behavior:none}
  #gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  #gl.grabbing{cursor:grabbing}
  #fallback{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;display:none}

  /* 穿越转场:字符星流层 / 金白闪光 / 玄夜落幕 */
  #fx{position:fixed;inset:0;width:100%;height:100%;z-index:4;pointer-events:none}
  #flash{position:fixed;inset:0;z-index:6;pointer-events:none;opacity:0;
    background:radial-gradient(circle at var(--fx,50%) var(--fy,46%),rgba(255,243,216,.96),rgba(212,178,104,.8) 30%,rgba(20,26,44,.9) 72%,#0E1220 100%)}
  #blackout{position:fixed;inset:0;z-index:7;pointer-events:none;opacity:0;background:#0E1220}
  body.warping .lockup,body.warping .enter,body.warping .hint{opacity:0!important;transition:opacity .5s}
  .enter{transition:background .3s,box-shadow .3s,opacity .5s}

  .lockup{position:fixed;left:max(24px,env(safe-area-inset-left));bottom:max(22px,env(safe-area-inset-bottom));
    z-index:5;color:var(--moon);font-family:var(--serif);line-height:1.3;pointer-events:none;
    text-shadow:0 1px 14px rgba(0,0,0,.65)}
  .lockup b{font-size:26px;font-weight:700;letter-spacing:.16em}
  .lockup b i{font-style:normal;color:var(--gold)}
  .lockup small{display:block;font-size:10px;letter-spacing:.42em;color:var(--gold);opacity:.85;margin-top:4px}

  .enter{position:fixed;left:50%;transform:translateX(-50%);bottom:max(26px,env(safe-area-inset-bottom));z-index:5;
    font-family:var(--serif);font-size:14px;letter-spacing:.3em;text-indent:.3em;color:var(--moon);
    text-decoration:none;padding:11px 30px;border:1px solid rgba(201,168,92,.55);border-radius:999px;
    background:rgba(14,18,32,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    transition:background .3s,box-shadow .3s}
  .enter:hover{background:rgba(201,168,92,.16);box-shadow:0 0 24px rgba(201,168,92,.25)}

  .hint{position:fixed;left:50%;top:max(20px,env(safe-area-inset-top));transform:translateX(-50%);z-index:5;
    color:var(--mist);font-family:var(--serif);font-size:12px;letter-spacing:.3em;text-indent:.3em;
    white-space:nowrap;pointer-events:none;opacity:.9;transition:opacity 1.2s}
  .hint.off{opacity:0}

  @media (max-width:520px){
    .lockup b{font-size:22px}
    .enter{font-size:13px;padding:10px 24px}
    .lockup{top:max(18px,env(safe-area-inset-top));bottom:auto;left:max(20px,env(safe-area-inset-left))}
    .hint{top:auto;bottom:calc(max(26px,env(safe-area-inset-bottom)) + 62px)}
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="fx"></canvas>
<div id="flash"></div>
<div id="blackout"></div>
<img id="fallback" alt="知星·观星台主视觉">
<div class="lockup"><b>知<i>·</i>星</b><small>命盘研究所</small></div>
<a class="enter" href="./app.html">进 入 知 星</a>

  [405, 419],   // 行星环 → 外弧环
  [452, 468]    // 外弧环 → 星野
];
/* 各带角速度(rad/s,正=顺时针)与拨转联动系数 */
const RATE = { T: 2*Math.PI/240, b2: -2*Math.PI/520, b3: 2*Math.PI/430, b4: -2*Math.PI/640, b5: 2*Math.PI/900, b6: -2*Math.PI/2400 };
const COUPLE = { b2: -0.16, b3: 0.12, b4: -0.09, b5: 0.06, b6: -0.02 };  // 乘以 swirl(瞬态),松手后回落归零

const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const DEBUG = /[?&]debug=1/.test(location.search);

const canvas = document.getElementById('gl');
const gl = canvas.getContext('webgl', { antialias: false, alpha: false, preserveDrawingBuffer: false });

const VERT = `
attribute vec2 a_p;
void main(){ gl_Position = vec4(a_p, 0.0, 1.0); }`;

const FRAG = `
precision highp float;
uniform sampler2D u_img;
uniform vec2  u_res;      /* 画布物理像素 */
uniform vec3  u_cover;    /* scale, ox, oy:画布px → 原图px */
uniform float u_time;
uniform float u_aT, u_a2, u_a3, u_a4, u_a5, u_a6;
uniform float u_hover;    /* 0..1 盘面悬停辉光 */
uniform float u_flow;     /* 盘内能量流动幅度 px */
uniform vec3  u_rip;      /* 三道流光的 age(秒),<0 为无效 */
uniform float u_debug;
uniform float u_dive;     /* 穿越下潜 0..1:四周压暗聚焦盘心 */
uniform vec2  u_dc;       /* 俯冲中心(画布 px,y 向下) */

const vec2  C  = vec2(${CX.toFixed(1)}, ${CY.toFixed(1)});
const vec2  SZ = vec2(${IMG_W.toFixed(1)}, ${IMG_H.toFixed(1)});
const vec2  EYE1 = vec2(1191.0, 365.0);
const vec2  EYE2 = vec2(1169.0, 577.0);

float ss(float a, float b, float x){ return smoothstep(a, b, x); }
float luma(vec3 c){ return dot(c, vec3(.299,.587,.114)); }
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  f = f*f*(3.0-2.0*f);
  return mix(mix(hash(i), hash(i+vec2(1,0)), f.x),
             mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), f.x), f.y);
}
vec3 fetch(vec2 p){ return texture2D(u_img, clamp(p/SZ, vec2(.001), vec2(.999))).rgb; }

void main(){
  vec2 pc = vec2(gl_FragCoord.x, u_res.y - gl_FragCoord.y);   /* 画布坐标(y向下) */
  vec2 p  = (pc - u_cover.yz) / u_cover.x;                    /* 原图像素坐标 */
  vec2 q  = p - C;
  float r = length(q);

  /* --- 分带角度场(边界落在环间暗隙,平滑过渡) --- */
  float a = u_aT;
  a = mix(a, 0.0,  ss(${BANDS[0][0]}.0, ${BANDS[0][1]}.0, r));
  a = mix(a, u_a2, ss(${BANDS[1][0]}.0, ${BANDS[1][1]}.0, r));
  a = mix(a, u_a3, ss(${BANDS[2][0]}.0, ${BANDS[2][1]}.0, r));
  a = mix(a, u_a4, ss(${BANDS[3][0]}.0, ${BANDS[3][1]}.0, r));
  a = mix(a, u_a5, ss(${BANDS[4][0]}.0, ${BANDS[4][1]}.0, r));
  a = mix(a, u_a6, ss(${BANDS[5][0]}.0, ${BANDS[5][1]}.0, r));

  float ca = cos(a), sa = sin(a);
  vec2 sp = C + mat2(ca, -sa, sa, ca) * q;   /* 旋转后的取样点 */

  /* --- 盘内能量流动(避开双鱼眼与盘缘) --- */
  float discIn = 1.0 - ss(170.0, 186.0, r);
  if (discIn > 0.001 && u_flow > 0.001){
    float e = min(length(p-EYE1), length(p-EYE2));
    float m = discIn * ss(34.0, 58.0, e);
    float t = u_time * 0.12;
    vec2 d = vec2(vnoise(sp*0.022 + t) - 0.5, vnoise(sp*0.022 + 37.7 - t) - 0.5);
    sp += d * (2.6 * u_flow * m);
  }

  vec3 rotCol = fetch(sp);
  vec3 staCol = fetch(p);

  /* --- 静止遮罩:天际线 + 中轴法器(盘面除外) --- */
  float disc  = 1.0 - ss(222.0, 236.0, r);
  float ground = ss(592.0, 652.0, p.y) * (1.0 - disc);
  float outside = ss(224.0, 238.0, r);
  float strip = (1.0 - ss(26.0, 44.0, abs(p.x - C.x))) * outside;
  float orn1  = 1.0 - ss(52.0, 70.0, length(p - vec2(C.x, 124.0)));
  float orn2  = 1.0 - ss(64.0, 86.0, length(p - vec2(C.x, 795.0)));
  float stat  = clamp(ground + strip + orn1 + orn2, 0.0, 1.0);

  vec3 col = mix(rotCol, staCol, stat);

  /* --- 点击流光:沿盘心扩散,只点亮明亮的金线 --- */
  float boost = ss(0.30, 0.55, luma(col));
  for (int i = 0; i < 3; i++){
    float age = i == 0 ? u_rip.x : (i == 1 ? u_rip.y : u_rip.z);
    if (age >= 0.0){
      float R = 60.0 + 430.0 * age;
      float w = 26.0 + 42.0 * age;
      float g = exp(-(r-R)*(r-R)/(w*w)) * exp(-age*1.15);
      col += g * boost * vec3(0.86, 0.67, 0.34) * 0.85;
    }
  }

  /* --- 悬停辉光:盘面轻呼吸 + 双鱼眼提亮 --- */
  if (u_hover > 0.001){
    float e1 = exp(-pow(length(p-EYE1)/26.0, 2.0));
    float e2 = exp(-pow(length(p-EYE2)/26.0, 2.0));
    col *= 1.0 + u_hover * 0.10 * disc;
    col += u_hover * (e1 + e2) * vec3(0.9, 0.75, 0.45) * 0.35;
  }

  /* --- 穿越下潜:按屏距向四周压暗,放大的软像素被吞进暗部 --- */
  if (u_dive > 0.001){
    float dd = distance(pc, u_dc);
    float k = smoothstep(u_res.y * 0.10, u_res.y * 0.72, dd);
    col = mix(col, col * vec3(0.20, 0.22, 0.30), u_dive * k);
  }

  /* --- 调试:分带圈(红)与静止遮罩(绿) --- */
  if (u_debug > 0.5){
    float edge = 0.0;
    edge += exp(-pow(r-${BANDS[0][0]}.0, 2.0)/6.0);
    edge += exp(-pow(r-${BANDS[1][1]}.0, 2.0)/6.0);
    edge += exp(-pow(r-${BANDS[2][1]}.0, 2.0)/6.0);
    edge += exp(-pow(r-${BANDS[3][1]}.0, 2.0)/6.0);
    edge += exp(-pow(r-${BANDS[4][1]}.0, 2.0)/6.0);
    edge += exp(-pow(r-${BANDS[5][1]}.0, 2.0)/6.0);
    col = mix(col, vec3(1.0, 0.15, 0.15), clamp(edge, 0.0, 0.85));
    col = mix(col, vec3(0.1, 0.9, 0.3), stat * 0.28);
  }

  gl_FragColor = vec4(col, 1.0);
}`;

/* ---------- WebGL 装配 ---------- */
function makeShader(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
let prog, U = {}, ready = false;
function boot(img){
  prog = gl.createProgram();
  gl.attachShader(prog, makeShader(gl.VERTEX_SHADER, VERT));
  gl.attachShader(prog, makeShader(gl.FRAGMENT_SHADER, FRAG));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'a_p');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, img);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

  ['u_res','u_cover','u_time','u_aT','u_a2','u_a3','u_a4','u_a5','u_a6','u_hover','u_flow','u_rip','u_debug','u_dive','u_dc']
    .forEach(n => U[n] = gl.getUniformLocation(prog, n));
  gl.uniform1f(U.u_debug, DEBUG ? 1 : 0);
  ready = true;
  resize();
  requestAnimationFrame(frame);
}

/* ---------- 视口:cover 裁切 + 焦点 + 视差余量 ---------- */
let cover = { s: 1, ox: 0, oy: 0 };
const DPR_CAP = 2;
function resize(){
  const dpr = Math.min(devicePixelRatio || 1, DPR_CAP);
  const cw = Math.round(innerWidth * dpr), ch = Math.round(innerHeight * dpr);
  if (canvas.width !== cw || canvas.height !== ch){
    canvas.width = cw; canvas.height = ch;
    canvas.style.width = innerWidth + 'px'; canvas.style.height = innerHeight + 'px';
    gl.viewport(0, 0, cw, ch);
  }
  const s = Math.max(cw / IMG_W, ch / IMG_H) * 1.035;   /* 3.5% 余量给视差 */
  let ox = cw / 2 - CX * s, oy = ch / 2 - FOCAL_Y * s;
  ox = Math.min(0, Math.max(cw - IMG_W * s, ox));
  oy = Math.min(0, Math.max(ch - IMG_H * s, oy));
  cover = { s, ox, oy };
  if (fx.width !== cw || fx.height !== ch){
    fx.width = cw; fx.height = ch;
    fx.style.width = innerWidth + 'px'; fx.style.height = innerHeight + 'px';
  }
}
addEventListener('resize', resize);

/* ---------- 交互状态 ---------- */
let thetaU = 0, vel = 0, swirl = 0, grabbing = false, lastAng = 0, lastT = 0, moved = 0;
let par = {x:0, y:0}, parT = {x:0, y:0};
let hover = 0, hoverT = 0;
const rips = [-1, -1, -1];
let ripN = 0;
const hintEl = document.getElementById('hint');
let hinted = false;

function toImg(e){
  const dpr = canvas.width / innerWidth;
  const x = (e.clientX * dpr - cover.ox - par.x) / cover.s;
  const y = (e.clientY * dpr - cover.oy - par.y) / cover.s;
  return { x, y, r: Math.hypot(x - CX, y - CY), ang: Math.atan2(y - CY, x - CX) };
}
function wrapPI(a){ while (a >  Math.PI) a -= 2*Math.PI; while (a < -Math.PI) a += 2*Math.PI; return a; }

canvas.addEventListener('pointerdown', e => {
  if (warpT0 >= 0) return;
  const m = toImg(e);
  moved = 0;
  if (m.r < 300){
    grabbing = true; canvas.classList.add('grabbing');
    lastAng = m.ang; lastT = performance.now();
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  }
  if (!hinted){ hinted = true; hintEl.classList.add('off'); }
});
canvas.addEventListener('pointermove', e => {
  const m = toImg(e);
  parT.x = -((e.clientX / innerWidth) - .5) * 2 * 7 * (canvas.width / innerWidth);
  parT.y = -((e.clientY / innerHeight) - .5) * 2 * 5 * (canvas.width / innerWidth);
  hoverT = m.r < 240 ? 1 : 0;
  if (grabbing){
    const now = performance.now(), dt = Math.max(8, now - lastT) / 1000;
    const d = wrapPI(m.ang - lastAng);
    thetaU += d;
    vel = 0.75 * vel + 0.25 * (d / dt);
    lastAng = m.ang; lastT = now;
    moved += Math.abs(d);
  }
});
function release(e){
  if (grabbing){ grabbing = false; canvas.classList.remove('grabbing'); }
  if (e && moved < 0.06 && e.type === 'pointerup'){          /* 视为轻点 → 流光 */
    rips[ripN % 3] = performance.now() / 1000;
    ripN++;
  }
}
canvas.addEventListener('pointerup', release);
canvas.addEventListener('pointercancel', () => release());
canvas.addEventListener('pointerleave', () => { hoverT = 0; parT.x = parT.y = 0; });

/* ---------- 穿越转场:进入知星 ---------- */
const fx = document.getElementById('fx'), fctx = fx.getContext('2d');
const flashEl = document.getElementById('flash'), blackEl = document.getElementById('blackout');
const enterBtn = document.querySelector('a.enter');
const WARP_SLOMO = /[?&]warp=slow/.test(location.search) ? 3 : 1;   // 调试:?warp=slow 三倍慢放
const WARP_NAV = 1.55;                                              // 总时长(秒)
const WC = [-0.55, 0.42, -0.30, 0.20, -0.10];                       // 各环加速配比(方向交错)
let warpT0 = -1, warpAnchor = null, glyphs = [], streaks = [], navved = false;
const SPR = {};   // 发光精灵缓存(字符×配色 / 光轨)
function glyphSprite(ch, col){
  const key = ch + col;
  if (SPR[key]) return SPR[key];
  const s = document.createElement('canvas'); s.width = s.height = 112;
  const c = s.getContext('2d');
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.font = '700 62px "Noto Serif SC","Songti SC","STSong",serif';
  c.shadowColor = 'rgba(' + col + ',.95)'; c.shadowBlur = 24;   // 外层辉光(双描加浓)
  c.fillStyle = 'rgba(' + col + ',.6)';
  c.fillText(ch, 56, 58); c.fillText(ch, 56, 58);
  c.shadowBlur = 0;                                              // 近白亮核
  const g = c.createLinearGradient(0, 18, 0, 96);
  g.addColorStop(0, '#fff8e6');
  g.addColorStop(.55, 'rgb(' + col + ')');
  g.addColorStop(1, 'rgba(' + col + ',.82)');
  c.fillStyle = g;
  c.fillText(ch, 56, 58);
  SPR[key] = s; return s;
}
function streakSprite(col){
  const key = 'st' + col;
  if (SPR[key]) return SPR[key];
  const s = document.createElement('canvas'); s.width = 256; s.height = 12;
  const c = s.getContext('2d');
  const g = c.createLinearGradient(0, 0, 256, 0);
  g.addColorStop(0, 'rgba(' + col + ',0)');
  g.addColorStop(.72, 'rgba(' + col + ',.85)');
  g.addColorStop(.94, '#fffdf4');
  g.addColorStop(1, 'rgba(255,253,244,0)');
  c.fillStyle = g;
  c.fillRect(0, 2, 256, 8);
  SPR[key] = s; return s;
}
const GLYPH_CHARS = ('甲乙丙丁戊己庚辛壬癸' + '子丑寅卯辰巳午未申酉戌亥' + '☰☱☲☳☴☵☶☷'
  + '角亢氐房心尾箕斗牛女虚危室壁奎娄胃昴毕觜参井鬼柳星张翼轸').split('');
const ss01 = x => { x = Math.min(1, Math.max(0, x)); return x * x * (3 - 2 * x); };

function startWarp(){
  if (warpT0 >= 0 || navved) return;
  if (REDUCED || !ready){ navved = true; location.href = './app.html'; return; }
  warpT0 = performance.now() / 1000;
  warpAnchor = { x: cover.ox + par.x + CX * cover.s, y: cover.oy + par.y + CY * cover.s, s: cover.s };
  const dpr = canvas.width / innerWidth;
  flashEl.style.setProperty('--fx', (warpAnchor.x / dpr / innerWidth * 100).toFixed(1) + '%');
  flashEl.style.setProperty('--fy', (warpAnchor.y / dpr / innerHeight * 100).toFixed(1) + '%');
  document.body.classList.add('warping');
  glyphs = [];
  for (let i = 0; i < 88; i++){
    const c = Math.random();
    glyphs.push({
      ch: GLYPH_CHARS[(Math.random() * GLYPH_CHARS.length) | 0],
      ang: Math.random() * Math.PI * 2,
      r0: 26 + Math.random() * 90,          // 起始半径(css px,盘心为原点)
      k: 2.1 + Math.random() * 1.5,          // 指数外飞速率
      t0: 0.22 + Math.random() * 0.62,       // 出发时刻
      sz: 13 + Math.random() * 11,
      col: c < 0.68 ? '201,168,92' : (c < 0.94 ? '232,228,216' : '181,71,47')
    });
  }
  streaks = [];                              // 曲速光轨隧道
  const NS = innerWidth < 700 ? 78 : 130;
  for (let i = 0; i < NS; i++){
    streaks.push({
      ang: Math.random() * Math.PI * 2,
      r0: 18 + Math.random() * 70,
      k: 2.6 + Math.random() * 1.7,
      t0: 0.12 + Math.random() * 0.75,
      len: 60 + Math.random() * 130,
      w: 1.2 + Math.random() * 2.6,
      gold: Math.random() < 0.5
    });
  }
}
enterBtn.addEventListener('click', e => { e.preventDefault(); startWarp(); });

function drawWarpFx(wt){
  fctx.clearRect(0, 0, fx.width, fx.height);
  if (wt < 0.06) return;
  const dpr = canvas.width / innerWidth;
  const ox = warpAnchor.x, oy = warpAnchor.y;
  const fadeOut = Math.max(0, 1 - Math.max(0, (wt - 1.18) / 0.26));
  fctx.globalCompositeOperation = 'lighter';

  /* 起手冲击波:双环扩散 */
  if (wt < 0.6){
    const p = ss01(wt / 0.6);
    for (let i = 0; i < 2; i++){
      const rr = (40 + 860 * p * (i ? .82 : 1)) * dpr;
      fctx.globalAlpha = (1 - p) * (i ? .35 : .6);
      fctx.strokeStyle = '#e9cf96';
      fctx.lineWidth = (i ? 1.2 : 2.6) * dpr * (1 - p * .6);
      fctx.beginPath(); fctx.arc(ox, oy, rr, 0, 7); fctx.stroke();
    }
    fctx.globalAlpha = 1;
  }

  /* 曲速光轨隧道(随太极自旋方向螺旋外掠) */
  for (const s of streaks){
    if (wt < s.t0) continue;
    const a = wt - s.t0;
    const th = s.ang + 0.85 * a;
    const rr = s.r0 * Math.exp(s.k * a) * dpr;
    if (rr > fx.width + fx.height) continue;
    const alpha = Math.min(1, a * 10) * fadeOut * .8;
    if (alpha <= 0.01) continue;
    const L = Math.min(rr * .62, s.len * dpr * (0.5 + a * 2.2));
    fctx.save();
    fctx.translate(ox + Math.cos(th) * rr, oy + Math.sin(th) * rr);
    fctx.rotate(th);
    fctx.globalAlpha = alpha;
    fctx.drawImage(streakSprite(s.gold ? '212,178,104' : '226,228,232'), -L, -s.w * dpr / 2, L, s.w * dpr);
    fctx.restore();
  }

  /* 字符星流:辉光精灵 + 三重残影,字头朝向飞行方向 */
  for (const g of glyphs){
    if (wt < g.t0) continue;
    const a = wt - g.t0;
    const spr = glyphSprite(g.ch, g.col);
    for (let e = 2; e >= 0; e--){
      const ae = a - e * 0.045;
      if (ae <= 0) continue;
      const th = g.ang + 0.85 * ae;
      const rr = g.r0 * Math.exp(g.k * ae) * dpr;
      if (rr > fx.width + fx.height) continue;
      const alpha = Math.min(1, ae * 9) * fadeOut * [1, .42, .18][e];
      if (alpha <= 0.01) continue;
      const S = g.sz * dpr * Math.min(3.4, 0.9 + rr / (240 * dpr)) * 1.8;
      fctx.save();
      fctx.translate(ox + Math.cos(th) * rr, oy + Math.sin(th) * rr);
      fctx.rotate(th + Math.PI / 2);
      fctx.globalAlpha = alpha;
      fctx.drawImage(spr, -S / 2, -S / 2, S, S);
      fctx.restore();
    }
  }
  fctx.globalAlpha = 1;
  fctx.globalCompositeOperation = 'source-over';
}

/* ---------- 主循环 ---------- */
const T0 = performance.now() / 1000;
let prev = T0;
function frame(){
  if (!ready) return;
  const now = performance.now() / 1000;
  const t = now - T0, dt = Math.min(0.05, now - prev);
  prev = now;

  if (!grabbing && Math.abs(vel) > 1e-4){ thetaU += vel * dt; vel *= Math.exp(-dt / 1.8); }
  swirl = (swirl + vel * dt) * Math.exp(-dt / 2.5);   // 环带联动瞬态:随拨转涌起,松手回落
  par.x += (parT.x - par.x) * (1 - Math.exp(-dt * 5));
  par.y += (parT.y - par.y) * (1 - Math.exp(-dt * 5));
  hover  += (hoverT - hover) * (1 - Math.exp(-dt * 6));

  const run = REDUCED ? 0 : 1;
  /* 转场:镜头俯冲进盘心 + 环系加速 + 闪光落幕 */
  let cS = cover.s, cX = cover.ox + par.x, cY = cover.oy + par.y, wBoost = 0, diveV = 0;
  if (warpT0 >= 0){
    const wt = (now - warpT0) / WARP_SLOMO;
    const z = 2.1 * Math.pow(ss01((wt - 0.10) / 1.20), 1.5);   /* 变焦收敛在 ×8 内,避免放大糊 */
    cS = warpAnchor.s * Math.exp(z);
    cX = warpAnchor.x - CX * cS;
    cY = warpAnchor.y - CY * cS;
    wBoost = 2.6 * wt * wt;
    diveV = ss01((wt - 0.42) / 0.55);                          /* 潜航压暗:光效接管画面 */
    flashEl.style.opacity = (ss01((wt - 0.88) / 0.34) * (1 - ss01((wt - 1.30) / 0.22))).toFixed(3);
    blackEl.style.opacity = ss01((wt - 1.10) / 0.36).toFixed(3);
    drawWarpFx(wt);
    if (wt >= WARP_NAV && !navved){ navved = true; location.href = './app.html'; }
  }
  const aT = RATE.T  * t * run + thetaU + wBoost;
  gl.uniform2f(U.u_res, canvas.width, canvas.height);
  gl.uniform3f(U.u_cover, cS, cX, cY);
  gl.uniform1f(U.u_time, t);
  gl.uniform1f(U.u_aT, aT);
  gl.uniform1f(U.u_a2, RATE.b2 * t * run + COUPLE.b2 * swirl + wBoost * WC[0]);
  gl.uniform1f(U.u_a3, RATE.b3 * t * run + COUPLE.b3 * swirl + wBoost * WC[1]);
  gl.uniform1f(U.u_a4, RATE.b4 * t * run + COUPLE.b4 * swirl + wBoost * WC[2]);
  gl.uniform1f(U.u_a5, RATE.b5 * t * run + COUPLE.b5 * swirl + wBoost * WC[3]);
  gl.uniform1f(U.u_a6, RATE.b6 * t * run + COUPLE.b6 * swirl + wBoost * WC[4]);
  gl.uniform1f(U.u_hover, hover);
  gl.uniform1f(U.u_flow, run);
  gl.uniform3f(U.u_rip,
    rips[0] < 0 ? -1 : Math.min(2.4, now - rips[0]),
    rips[1] < 0 ? -1 : Math.min(2.4, now - rips[1]),
    rips[2] < 0 ? -1 : Math.min(2.4, now - rips[2]));
  gl.uniform1f(U.u_dive, diveV);
  gl.uniform2f(U.u_dc, warpAnchor ? warpAnchor.x : 0, warpAnchor ? warpAnchor.y : 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) prev = performance.now()/1000; });

/* ---------- 启动(WebGL 不可用则回退静态图) ---------- */
const img = new Image();
img.onload = () => {
  if (!gl){ const f = document.getElementById('fallback'); f.src = IMG_B64; f.style.display = 'block'; canvas.remove(); return; }
  try { boot(img); }
  catch (err){ const f = document.getElementById('fallback'); f.src = IMG_B64; f.style.display = 'block'; canvas.remove(); console.error(err); }
};
img.src = IMG_B64;
</script>
